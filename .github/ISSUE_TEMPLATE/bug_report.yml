name: Bug report
description: Report a reproducible SDK, mock or playground issue
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include exact synthetic input and output. Never include real credentials or taxpayer data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version and runtime
    validations:
      required: true
